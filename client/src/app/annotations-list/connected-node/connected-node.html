<div
  class="flex min-w-0 items-center border-b border-slate-200 py-2 text-slate-900"
  [class.border-b-0]="lastEntry()"
  [class.hover:bg-gray-100]="node().link"
>
  @let link = node().link;
  @if (link && link.router) {
    <a class="flex min-w-0 flex-1 items-center text-slate-900 no-underline" [routerLink]="$safeNavigationMigration(node().link?.href)">
      <ng-container *ngTemplateOutlet="linkContent" />
    </a>
  } @else if (link && !link.router) {
    <a class="flex min-w-0 flex-1 items-center text-slate-900 no-underline" [href]="$safeNavigationMigration(node().link?.href)">
      <ng-container *ngTemplateOutlet="linkContent" />
    </a>
  } @else {
    <div class="flex min-w-0 flex-1 items-center text-slate-900 no-underline">
      <ng-container *ngTemplateOutlet="linkContent" />
    </div>
  }

  @if (node().id; as nodeId) {
    <div class="flex flex-col justify-end px-2">
      <button
        suiButton
        (click)="clickDeleteAnnotationRelation(annotationId(), nodeId, $event)"
        severity="error"
        variant="outlined"
        size="sm"
        aria-label="Delete"
      >
        <app-icon name="trash" />
      </button>
    </div>
  }
</div>

<ng-template #linkContent>
  <div class="flex shrink-0 justify-center px-3 py-2">
    <app-icon [name]="node().directionIcon" />
  </div>

  <div class="flex min-w-0 flex-1 flex-col items-start gap-1 py-2">
    <div class="flex flex-col max-w-24">
      <app-node-types [nodeTypes]="node().node.types" asChips hideRamenCoreTypes />
    </div>

    <div class="min-w-0 wrap-anywhere text-sm font-medium">{{ title() }}</div>
  </div>
</ng-template>
