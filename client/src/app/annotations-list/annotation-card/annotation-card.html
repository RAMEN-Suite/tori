<ng-container *transloco="let t">
  @if (annotation().id) {
    @let annotationId = annotation().id!;

    <div class="grid min-w-0 overflow-hidden rounded-xl border border-slate-200 bg-white xl:grid-cols-2">
      <div class="flex min-w-0 flex-col gap-4 p-4">
        <div class="mb-3">
          <app-node-types [nodeTypes]="annotation().annotation.types" asChips class="flex flex-col gap-1" />
        </div>
        <div>
          <app-attribute-list [properties]="annotation().annotation.properties" />
        </div>
        <div class="mt-auto flex flex-wrap gap-2 border-t border-slate-100 pt-3">
          <button
            suiButton
            severity="error"
            variant="outlined"
            size="sm"
            (click)="clickDeleteAnnotation(annotationId, $event)"
            aria-label="Delete"
          >
            <app-icon name="trash" />
          </button>
          <app-update-annotation [annotation]="annotation().annotation" />
          <button
            suiButton
            severity="primary"
            variant="outlined"
            size="sm"
            (click)="clickCreateAnnotationConnection(annotation().annotation)"
            aria-label="Add connection"
          >
            <app-icon name="plus-circle" />
          </button>
        </div>
      </div>
      <div
        class="min-w-0 border-t border-slate-200 bg-slate-50/60 xl:border-t-0 xl:border-l"
        [ngClass]="{
          'flex items-center p-4': annotation().nodes.length <= 0,
        }"
      >
        @for (node of annotation().nodes; track node.id; let first = $first; let last = $last) {
          <app-connected-node [annotationId]="annotationId" [node]="node" [firstEntry]="first" [lastEntry]="last" />
        } @empty {
          <span class="text-sm leading-relaxed text-slate-500">
            {{ t("app.shared.annotationCard.emptyNodes.prefix") }}
            <app-icon name="plus-circle" class="text-blue-700 text-sm" />
            {{ t("app.shared.annotationCard.emptyNodes.suffix") }}
          </span>
        }
      </div>
    </div>
  }
</ng-container>
