<sui-sidebar
  *transloco="let t"
  class="h-full lg:rounded-2xl lg:border lg:border-slate-200 lg:shadow-sm"
  [groups]="groups()"
  [value]="active()"
  [collapsed]="collapsed()"
  [ariaLabel]="t('app.screens.workspace.shortcuts')"
  (valueChange)="selectView($event)"
>
  <div suiSidebarHeader class="flex min-h-10 items-center justify-between gap-2" [class.justify-center]="collapsed()">
    @if (!collapsed()) {
      <span class="pl-1 text-xs font-semibold tracking-wide text-slate-500 uppercase">{{ t("app.screens.workspace.shortcuts") }}</span>
    }
    <button
      suiButton
      type="button"
      variant="text"
      severity="neutral"
      shape="square"
      size="sm"
      class="hidden lg:inline-flex"
      (click)="collapsed.set(!collapsed())"
      [attr.aria-expanded]="!collapsed()"
      [attr.aria-label]="t('app.screens.workspace.toggleSidebar')"
    >
      <app-icon name="sidebar" />
    </button>
    <button
      suiButton
      type="button"
      variant="text"
      severity="neutral"
      shape="square"
      size="sm"
      class="lg:hidden"
      (click)="closeRequested.emit()"
      [attr.aria-label]="t('app.screens.workspace.closeSidebar')"
    >
      <app-icon name="times" />
    </button>
  </div>
  <ng-template [suiSidebarItem]="groups()" let-item let-collapsed="collapsed">
    <span class="flex min-w-0 flex-1 items-center gap-2.5" [class.justify-center]="collapsed">
      <app-icon [name]="item.icon" />
      <span class="min-w-0 flex-1 truncate" [class.sr-only]="collapsed">{{ item.label }}</span>
    </span>
  </ng-template>
</sui-sidebar>
