<ng-container *transloco="let t">
  <div
    role="group"
    [attr.aria-label]="t('app.screens.workspace.filters')"
    class="mb-5 flex min-w-0 flex-wrap items-center gap-2 border-b border-slate-200 pb-4"
  >
    <div class="w-56 max-w-full">
      <sui-multi-select
        [class]="search.form.controls.types.value.length ? '[&_.sui-form-control]:border-blue-200 [&_.sui-form-control]:bg-blue-100' : ''"
        [options]="search.types() | options"
        [ngModel]="search.form.controls.types.value"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="updateTypes($event)"
        [disabled]="search.searching()"
        [ariaLabel]="t('app.screens.search.types')"
        [placeholder]="t('app.screens.search.types')"
        [clearLabel]="t('app.screens.workspace.clearTypeFilter')"
        showClear
        fluid
        size="sm"
      />
    </div>
    @for (filter of search.collectionFilters(); track filter.type) {
      <div class="w-56 max-w-full">
        <sui-select
          [class]="filter.control.value ? '[&_.sui-form-control]:border-blue-200 [&_.sui-form-control]:bg-blue-100' : ''"
          [compareWith]="compareSelectionValues"
          [options]="filter.options | options"
          [ngModel]="filter.control.value"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="updateCollection(filter.type, $event)"
          [disabled]="search.searching() || filter.control.disabled"
          [ariaLabel]="filter.type"
          [placeholder]="filter.type"
          showClear
          filter
          fluid
          size="sm"
        />
      </div>
    }
    @if (search.hasFilters()) {
      <button
        suiButton
        type="button"
        variant="text"
        severity="secondary"
        size="sm"
        [disabled]="search.searching()"
        (click)="search.clearFilters()"
      >
        <app-icon name="times" />{{ t("app.screens.workspace.clearResultFilters") }}
      </button>
    }
  </div>
</ng-container>
