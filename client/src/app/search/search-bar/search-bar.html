<form *transloco="let t" [formGroup]="search.form" (ngSubmit)="submit()" class="flex min-w-0 flex-col">
  <div class="flex min-w-0 items-center gap-1" [class]="workspace() ? 'rounded-full bg-blue-50 px-2 py-1' : 'flex-col items-stretch gap-2'">
    @if (!workspace()) {
      <span class="text-sm font-semibold">{{ t("app.screens.search.inputLabel") }}</span>
    }
    <sui-autocomplete
      class="min-w-0 flex-1"
      [class]="
        workspace() ? '[&_.sui-form-control]:border-transparent [&_.sui-form-control]:bg-transparent [&_.sui-form-control]:shadow-none' : ''
      "
      [ariaLabel]="t('app.screens.search.inputLabel')"
      [placeholder]="t('app.screens.search.placeholder')"
      [minQueryLength]="3"
      formControlName="label"
      [options]="options()"
      [invalid]="search.attempted() && search.form.controls.label.invalid"
      [touched]="search.attempted()"
      (input)="search.attempted.set(false)"
      (queryChange)="suggest($event)"
      (valueChange)="select($event)"
      fluid
    >
      <ng-template suiAutocompletePrefix><app-icon name="search" class="text-slate-500" /></ng-template>
      <ng-template suiAutocompleteItem let-entity
        ><span class="wrap-anywhere text-slate-900">{{ entity.label }}</span></ng-template
      >
    </sui-autocomplete>
    @if (workspace()) {
      <button
        suiButton
        variant="text"
        severity="secondary"
        shape="circle"
        class="shrink-0 px-2.5"
        type="button"
        (click)="openFilters()"
        [attr.aria-expanded]="filtersOpen()"
        aria-haspopup="dialog"
        [attr.aria-label]="t('app.screens.workspace.filters')"
      >
        <app-icon name="sliders" />
      </button>
      <button
        suiButton
        variant="text"
        severity="secondary"
        shape="circle"
        class="shrink-0 px-2.5"
        type="submit"
        [loading]="search.searching()"
        [attr.aria-label]="t('app.shared.filterPane.submitBtn.label')"
      >
        <app-icon name="arrow-right" />
      </button>
    }
  </div>
  @if (!filtersOpen() && search.attempted() && search.form.controls.label.invalid) {
    <div role="alert" class="px-2 pt-1 text-sm text-red-700">{{ t("app.shared.filterPane.label.error") }}</div>
  }
</form>
