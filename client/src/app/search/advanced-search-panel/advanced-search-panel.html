<section
  *transloco="let t"
  role="dialog"
  [attr.aria-label]="t('app.screens.workspace.filters')"
  aria-modal="true"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  class="grid max-h-[calc(100dvh-9rem)] w-full gap-6 overflow-y-auto rounded-3xl border border-slate-200 bg-blue-50 p-5 shadow-xl sm:p-6"
>
  <header class="flex items-center justify-between gap-3">
    <h2 class="text-xl font-semibold">{{ t("app.screens.workspace.filters") }}</h2>
    <button
      suiButton
      type="button"
      variant="text"
      severity="secondary"
      shape="circle"
      [attr.aria-label]="t('app.screens.workspace.closeFilters')"
      (click)="closed.emit()"
    >
      <app-icon name="times" />
    </button>
  </header>
  <label class="grid gap-2 text-sm font-semibold">
    <span>{{ t("app.screens.search.inputLabel") }}</span>
    <input
      suiInput
      fluid
      suiAutoFocus
      type="search"
      [formControl]="search.form.controls.label"
      [placeholder]="t('app.screens.search.placeholder')"
      (input)="updateQuery($event)"
      [attr.aria-invalid]="search.attempted() && search.form.controls.label.invalid"
      (keydown.enter)="onEnter($event)"
    />
  </label>
  @if (search.attempted() && search.form.controls.label.invalid) {
    <div role="alert" class="text-sm text-red-700">{{ t("app.shared.filterPane.label.error") }}</div>
  }
  <app-search-filter-fields [compact]="true" />
  <div class="flex flex-wrap items-center justify-end gap-2">
    <button suiButton type="button" variant="text" severity="secondary" (click)="resetRequested.emit()">
      {{ t("app.shared.filterPane.resetBtn.tooltip") }}
    </button>
    <button suiButton type="button" [loading]="search.searching()" (click)="searchRequested.emit()">
      {{ t("app.shared.filterPane.submitBtn.label") }}
    </button>
  </div>
</section>
