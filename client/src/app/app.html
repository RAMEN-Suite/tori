<app-confirm-dialog />
<sui-toast horizontal="end" vertical="top" motion="fade" dismissLabel="Close notification" style="--sui-toast-offset-block: 5rem">
  <ng-template [suiToastContent]="SushiToastTemplates.HTML" let-toast>
    <div class="grid gap-1">
      <span class="font-semibold">{{ toast.title }}</span>
      <div class="text-sm" [innerHTML]="toast.message"></div>
    </div>
  </ng-template>
</sui-toast>

<div class="flex h-dvh flex-col overflow-hidden bg-slate-50 font-sans text-slate-900">
  <header class="relative z-20 shrink-0">
    @if (navbarOutlet.template(); as navbarTemplate) {
      <ng-container [ngTemplateOutlet]="navbarTemplate" />
    } @else {
      <app-navbar class="block" />
    }
  </header>
  <div
    class="flex min-h-0 flex-1 flex-col overflow-y-auto scrollbar-gutter-both lg:scrollbar-gutter-stable"
    #appContent
    (scroll)="onContentScroll($event)"
  >
    <main class="flex-1 shrink-0">
      @if (loaded()) {
        <router-outlet />
      } @else {
        <div class="flex min-h-[60vh] items-center justify-center" *transloco="let t">
          <span suiSpinner role="status" [attr.aria-label]="t('app.shared.common.loading')"></span>
        </div>
      }
    </main>

    <!-- Scroll-to-top Button -->
    <button
      suiButton
      class="fixed right-4 bottom-4 z-10 shadow-sm"
      [class.hidden]="!showScrollTop"
      severity="accent"
      variant="outlined"
      shape="circle"
      (click)="scrollToTop()"
      aria-label="Scroll to top"
    >
      <app-icon name="arrow-up" />
    </button>

    <footer class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-4 px-4 py-5 text-xs text-slate-500 sm:px-6">
      <a
        class="rounded-sm hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-4"
        [href]="'https://github.com/RAMEN-Suite/AWEN'"
        target="_blank"
      >
        <div class="flex items-center gap-1.5">
          <span>TORI</span>
          @if (healthStatusLoaded()) {
            <small>v{{ appVersion() }}</small>
          } @else {
            <div suiSkeleton></div>
          }
        </div>
      </a>

      <div class="flex items-center gap-2">
        <a
          class="rounded-sm hover:text-slate-900 focus-visible:outline-2 focus-visible:outline-offset-4"
          [href]="'https://ramen-schema.org'"
          target="_blank"
        >
          <div class="flex items-center gap-1.5">
            <span>RAMEN</span>
            @if (healthStatusLoaded()) {
              <small>v{{ ramenVersion() }}</small>
            } @else {
              <div suiSkeleton></div>
            }
          </div>
        </a>
      </div>
    </footer>
  </div>
</div>
