<app-confirm-dialog />
<sui-toast horizontal="end" vertical="top" motion="fade" dismissLabel="Close notification" style="--sui-toast-offset-block: 5rem">
  <ng-template [suiToastContent]="SushiToastTemplates.HTML" let-toast>
    <div class="grid gap-1">
      <span class="font-semibold">{{ toast.title }}</span>
      <div class="text-sm" [innerHTML]="toast.message"></div>
    </div>
  </ng-template>
</sui-toast>

<div class="app-shell">
  <app-navbar class="topbar" />

  <div class="app-content" #appContent (scroll)="onContentScroll($event)">
    @if (loaded()) {
      <router-outlet />
    } @else {
      <div class="loading-wrapper" *transloco="let t">
        <span suiSpinner role="status" [attr.aria-label]="t('app.shared.common.loading')"></span>
      </div>
    }
  </div>
</div>

<!-- Scroll-to-top Button -->
<button
  suiButton
  class="scroll-top-btn"
  [class.visible]="showScrollTop"
  severity="accent"
  variant="outlined"
  shape="circle"
  (click)="scrollToTop()"
  aria-label="Scroll to top"
>
  <app-icon name="arrow-up" />
</button>

<footer class="configMenuBar flex gap-2">
  <a
    suiButton
    class="no-underline h-12"
    size="sm"
    severity="secondary"
    variant="outlined"
    [href]="'https://github.com/RAMEN-Suite/AWEN'"
    target="_blank"
  >
    <div class="flex flex-col justify-center text-center gap-1">
      <span>TORI</span>
      @if (healthStatusLoaded()) {
        <small>v{{ appVersion() }}</small>
      } @else {
        <div suiSkeleton></div>
      }
    </div>
  </a>

  <div class="flex items-center gap-2 h-12">
    <a
      suiButton
      class="no-underline h-12"
      size="sm"
      severity="secondary"
      variant="outlined"
      [href]="'https://ramen-schema.org'"
      target="_blank"
    >
      <div class="flex flex-col justify-center text-center gap-1">
        <span>RAMEN</span>
        @if (healthStatusLoaded()) {
          <small>v{{ ramenVersion() }}</small>
        } @else {
          <div suiSkeleton></div>
        }
      </div>
    </a>
  </div>
</footer>
