<nav *transloco="let t" class="border-b border-slate-200 bg-white">
  <div
    class="mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6"
    [class.max-w-7xl]="!workspace()"
    [class.max-w-screen-2xl]="workspace()"
  >
    <div class="flex items-center gap-4">
      <a routerLink="/" (click)="homeClicked.emit()" class="text-2xl font-bold tracking-widest text-blue-700">TORI</a>
      @if (!isHomeRoute()) {
        <app-back-button />
      }
    </div>
    @if (workspace()) {
      <div class="order-last w-full min-w-0 lg:order-none lg:w-auto lg:max-w-3xl lg:flex-1">
        <ng-content select="[navbar-search]" />
      </div>
    }
    <div class="flex flex-wrap items-center gap-2" [class.w-full]="!workspace()" [class]="workspace() ? '' : 'sm:w-auto'">
      <app-create-entity class="mr-auto sm:mr-0" [compact]="workspace()" />
      <a suiButton class="px-2.5" severity="secondary" variant="outlined" [routerLink]="['/config']" aria-label="Settings"
        ><app-icon name="cog"
      /></a>
      <button suiButton class="px-2.5" variant="outlined" [suiPopoverTrigger]="popover" aria-label="Language">
        <app-icon name="language" />
      </button>
      <sui-popover #popover="suiPopover" placement="bottom">
        <div class="flex min-w-44 flex-col gap-2 p-2">
          @for (key of languages(); track key) {
            <button suiButton [variant]="key === activeLanguage() ? null : 'outlined'" (click)="handleLanguageChange(key, popover)">
              @if (key === activeLanguage()) {
                <app-icon name="check" />
              }
              {{ t("app.languages." + key) }}
            </button>
          }
        </div>
      </sui-popover>
    </div>
  </div>
</nav>
