<nav *transloco="let t" class="flex flex-wrap items-center justify-between gap-3 border-b border-blue-100 bg-blue-50 px-5 py-3">
  <div class="flex items-center gap-5">
    <a routerLink="/" class="text-3xl font-bold tracking-widest text-blue-700">TORI</a>
    @if (!isHomeRoute()) {
      <app-back-button />
    }
  </div>
  <div class="flex items-center gap-2">
    <app-create-entity />
    <a suiButton severity="secondary" variant="outlined" [routerLink]="['/config']" aria-label="Settings"><app-icon name="cog" /></a>
    <button suiButton variant="outlined" [suiPopoverTrigger]="popover" aria-label="Language"><app-icon name="language" /></button>
    <sui-popover #popover="suiPopover" placement="bottom">
      <div class="flex min-w-44 flex-col gap-2 p-2">
        @for (key of languages(); track key) {
          <button suiButton [variant]="key === activeLanguage() ? null : 'outlined'" (click)="handleLanguageChange(key, popover)">
            @if (key === activeLanguage()) {
              <app-icon name="check" />
            }
            {{ t("app.languages." + key) }}
          </button>
        }
      </div>
    </sui-popover>
  </div>
</nav>
