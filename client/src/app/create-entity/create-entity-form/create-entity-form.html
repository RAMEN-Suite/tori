<form *transloco="let t" (submit)="onSubmit($event)" class="flex flex-col gap-6">
  <div class="flex flex-col-reverse gap-2">
    <sui-select
      appendTo="body"
      [formControl]="typeInput"
      [options]="types() | options"
      [filter]="true"
      [showClear]="false"
      [loading]="!typesLoaded()"
      fluid
      id="create-entity-form_type-input"
    />
    <label for="create-entity-form_type-input">{{ t("app.shared.createEntityForm.type.label") }}</label>
  </div>
  <app-attribute-form [formName]="typeInput.value" [properties]="properties()" [enableCheckForSimilarLabels]="true" />
  <div class="flex justify-end border-t border-slate-100 pt-4" [class]="typeInput.value === '' ? 'hidden' : ''">
    <button suiButton type="submit" size="lg" [disabled]="propertiesForm().invalid || loading() || !typeInput.value" [loading]="loading()">
      {{ t("app.shared.actions.create") }}
    </button>
  </div>
</form>
