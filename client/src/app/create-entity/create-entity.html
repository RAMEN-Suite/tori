<ng-container *transloco="let t">
  <div class="inline-flex items-center gap-1">
    <button suiButton class="px-3 sm:rounded-r-none" (click)="create()" [attr.aria-label]="t('app.shared.createEntity.label')">
      @if (compact()) {
        <app-icon name="plus" class="sm:hidden" />
      }
      <span [class]="compact() ? 'hidden sm:inline' : ''">{{ t("app.shared.createEntity.label") }}</span>
    </button>
    @if (showTypeMenu()) {
      <button
        suiButton
        class="rounded-l-none px-2.5"
        variant="outlined"
        [suiMenuTrigger]="types"
        [attr.aria-label]="t('app.shared.createEntityForm.type.label')"
      >
        <app-icon name="chevron-down" />
      </button>
      <sui-menu
        #types
        [items]="typeItems()"
        popup
        severity="neutral"
        [ariaLabel]="t('app.shared.createEntityForm.type.label')"
        (itemSelected)="create($event)"
      >
        <ng-template suiMenuStart>
          <div class="mb-1 border-b border-slate-100 px-3 py-2 text-xs font-semibold text-slate-500">
            {{ t("app.shared.createEntity.label") }}
          </div>
        </ng-template>
        <ng-template [suiMenuItem]="typeItems()" let-item>
          <span class="flex min-w-36 items-center gap-2 text-sm text-slate-700">
            <span class="flex size-6 shrink-0 items-center justify-center rounded-md bg-slate-100 text-slate-500"
              ><app-icon name="tag"
            /></span>
            <span class="min-w-0 flex-1 text-start">{{ item.label }}</span>
          </span>
        </ng-template>
      </sui-menu>
    }
  </div>
</ng-container>
