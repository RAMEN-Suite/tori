<ng-container *transloco="let t">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-wrap">
    <div class="flex flex-wrap gap-2 w-full">
      <sui-autocomplete
        formControlName="label"
        [options]="suggestionOptions()"
        [invalid]="form.controls.label.invalid && form.controls.label.touched"
        (queryChange)="autocompleteChanges($event)"
        (valueChange)="onSuggestionValue($event)"
        fluid
        autofocus
      >
        <ng-template let-entity suiAutocompleteItem>
          @if (enableLinkToEntity()) {
            <a
              [routerLink]="['/', 'entity', suggestionId(entity.value)]"
              [target]="openLinkInNewTab() ? '_blank' : ''"
              class="flex items-center gap-2"
            >
              <span class="text-black/90">{{ entity.label }}</span>
            </a>
          } @else {
            <div class="flex items-center gap-2">
              <span class="text-black/90">{{ entity.label }}</span>
            </div>
          }
        </ng-template>
      </sui-autocomplete>
      @if (form.controls.label.invalid && form.controls.label.touched) {
        <div severity="error" size="sm" role="alert" class="text-sm text-red-700">{{ t("app.shared.filterPane.label.error") }}</div>
      }
    </div>
    @for (input of collectionFilterOptions(); track $index) {
      <div [formGroup]="form.controls.collectionFilter" class="flex flex-wrap gap-2 w-full md:flex-1 min-w-0">
        <sui-select
          [compareWith]="compareSelectionValues"
          [options]="input.values | options"
          [formControlName]="input.type"
          [placeholder]="t('app.shared.filterPane.collection.placeholder', { collectionType: input.type })"
          showClear
          filter
          class="w-full"
        />
      </div>
    }
    <div class="flex flex-wrap gap-2 w-full">
      <app-type-filter [(form)]="form.controls.types" />
    </div>
    <div class="flex flex-wrap gap-2 w-full flex justify-end gap-2">
      <button
        suiButton
        variant="text"
        type="button"
        [suiTooltip]="t('app.shared.filterPane.resetBtn.tooltip')"
        (click)="resetFilterClicked()"
      >
        <app-icon name="undo" />
      </button>
      <button suiButton type="submit">{{ t("app.shared.filterPane.submitBtn.label") }}</button>
    </div>
  </form>
</ng-container>
