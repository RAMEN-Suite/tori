<table>
  <thead>
    <tr>
      <td>Action</td>
      <td>Shortcut</td>
      <td>Reset</td>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.slug) {
      <tr>
        <td>{{ row.title }}</td>
        <td>{{ displayShortcut(row.effectiveShortcut?.keys) }}</td>
        <td><button>Reset</button></td>
      </tr>
    }
  </tbody>
</table>
