<div class="flex items-center gap-2">
  <button
    suiButton
    type="button"
    class="justify-start"
    variant="outlined"
    [class.border-amber-500]="validationError() !== null"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (click)="startRecording()"
    (keydown)="handleKeydown($event)"
  >
    @if (displayValue()) {
      <span>{{ displayValue() }}</span>
    } @else {
      <span class="text-slate-500">{{ placeholder() }}</span>
    }
  </button>

  @if (keys() !== null) {
    <button suiButton type="button" variant="outlined" [disabled]="disabled()" aria-label="Clear shortcut" (click)="clear($event)">
      <app-icon name="times" />
    </button>
  }
</div>
